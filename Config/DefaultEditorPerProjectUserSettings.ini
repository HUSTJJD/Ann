; Epic's in-editor MCP server (UE6 Experimental, Editor target only).
; BaseEditorPerProjectUserSettings.ini already sets bAutoStartServer=True;
; the values below are pinned so the client URL in
; Docs/ai-capabilities/ludus-toolset-gap.md stays reproducible.
; Commandlets skip auto-start by design; pass -ModelContextProtocolStartServer
; for headless sessions.
