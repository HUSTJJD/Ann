; Ann 工程侧 UnLuaNova 覆盖项。
; 只写与插件默认值不同的键；完整默认值见
; Plugins/UnLuaNova/Plugins/UnLuaNova/Config/DefaultUnLuaNova.ini
; 由旧 UnLua 迁移而来（2026-11-16）。

[/Script/UnLuaNova.UnLuaNovaSettings]
StartupModuleName=
DanglingCheck=True
DeadLoopCheck=50
; 沿用旧 UnLua 的按 GameInstance 隔离 LuaEnv。
EnvLocatorClass=/Script/UnLuaNova.LuaEnvLocator_ByGameInstance
; 模块定位用默认的 ULuaModuleLocator_ByBinding（接口 → 配置映射 → 绑定组件）。
; 不显式写 ModuleLocatorClass，避免类路径重构后变成陈旧值。
; 数据驱动绑定：3 个蓝图覆写脚本位于 Content/StartUp/Script/Blueprint/，
; 而蓝图资产位于 Content/StartUp/Blueprint/，按包路径定位会对不上，故用显式映射。
bDataDrivenBinding=True
+ClassModuleBindings=(Class="/Game/StartUp/Blueprint/BP_AnnGameInstance.BP_AnnGameInstance_C",ModuleName="StartUp.Script.Blueprint.BP_AnnGameInstance")
+ClassModuleBindings=(Class="/Game/StartUp/Blueprint/BP_StartUp_Client.BP_StartUp_Client_C",ModuleName="StartUp.Script.Blueprint.BP_StartUp_Client")
+ClassModuleBindings=(Class="/Game/StartUp/Blueprint/BP_StartUp_Server.BP_StartUp_Server_C",ModuleName="StartUp.Script.Blueprint.BP_StartUp_Server")

[/Script/UnLuaNovaEditor.UnLuaNovaEditorSettings]
; 沿用旧 DefaultUnLuaEditor.ini 的行为开关。
HotReloadMode=Auto
bEnableDebug=True
; 旧键 bEnableUnrealInsights 在 UnLuaNova 中无对应项，已移除。
; bLuaCompileAsCpp / bWithUE4Namespace 不沿用旧值：Luau 后端下使用 UnLuaNova 默认值
; （Lua 源码编译成 C++ 属 Lua 后端路径；UE 命名空间由新插件默认提供）。
; 编译期后端：Lua / Luau，切换后需重新编译 C++ 模块。
LuaBackend=Luau
